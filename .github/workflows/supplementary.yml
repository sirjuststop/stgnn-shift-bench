name: Supplementary experiment tests
on:
  push:
    paths:
      - 'experiments/**'
      - 'configs/supplementary_experiments.json'
      - 'third_party/**'
      - 'tests/test_supplementary.py'
      - 'requirements*.txt'
      - '.github/workflows/supplementary.yml'
  pull_request:
    paths:
      - 'experiments/**'
      - 'configs/supplementary_experiments.json'
      - 'third_party/**'
      - 'tests/test_supplementary.py'
      - 'requirements*.txt'
      - '.github/workflows/supplementary.yml'
permissions:
  contents: read
jobs:
  cpu-protocol-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-supplementary.txt
      - run: python -m unittest discover -s tests -p test_supplementary.py -v
